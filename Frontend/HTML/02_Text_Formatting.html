<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formating</title>
</head>
<body>
    <i>Ram And Krishna</i>
    <br>
    <em>Ram And Krishna</em>
    <br>
    <b>Ram And Krishna</b>
    <br>
    <strong>Ram And Krishna</strong>
    <br>
    <small>Ram And Krishna</small>
    <br>
    <mark>Ram And Krishna</mark>
    <br>
    <p>Gods<sub>Ram And Krishna</sub></p>
    <br>
    <p>Gods<sup>Ram And Krishna</sup></p>
    <del>Ram And Krishna</del>
    <br>
    <ins>Ram And Krishna</ins>
</body>
</html>
