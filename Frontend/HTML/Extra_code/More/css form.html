<!doctype html>
 <html>
   <head>
     <title>
	Registration Page 
     </title>
   </head>
<style>
tbody {background-color: lightgreen;}
thead {background-color: orange;} 
</style>
   
 <body bgcolor ="lightblue">
      <table style= "border:5px solid black;"  >
      <thead>
         <tr>
         <th colspan="2"  style= "color:blue;border:10px black;text-align:center; border-radius:5px;  padding:15px;" >Registration</th>
         </tr>
      </thead>
 <tbody>
         <tr>     
	 <td>NAME:</td> 
	 <td >
		    <input type= "textbox" name="frame"  placeholder="enter your name" style= "border:5px solid black;text-align:left; border-radius:5px; padding:8px;" /></td>
         </tr>
         <tr>		        
         <td>Email:</td>
                  <td>
		     <input type="textbox" name="email" placeholder="enter your email" style= "border:5px solid black;text-align:left; border-radius:5px; padding:8px;"/></td>
         <tr>
         <td>Password:</td>										
	          <td>
		     <input type="password" name="password" placeholder="Please enter password" style= "border:5px solid black;text-align:left; border-radius:5px; padding:8px;"/> </td>
         </tr>

         
         <tr>						 
	 <td >Gender: </td>
	 <td style= "border:5px solid black;text-align:left;border-radius:5px;  padding:8px"> 
	            <input type="radio" name="gender" value="male" id="gender1"/>male
                    <input type="radio" name="gender" value="female" id="gender2"/>female
                    <input type="radio" name="gender" value="others" id="gender3"/>others
	 </td>
         </tr>
         <tr>										
	 <td>	Date of birth:</td>
	 <td style= "border:5px solid black;text-align:left; border-radius:5px;  padding:8px">  <input type="date" name="DOB" />     </td>
         </tr>
		
         <tr>	
         <td> Select Country</td>							
	 <td style= "border:5px solid black;text-align:left; border-radius:5px;  padding:8px"> <select name="country">
                <option value = "DE"> Delhi    </option>
                <option value = "NE"> Nepal    </option>
                <option value = "LU"> Lucknow    </option>
                <option value = "OTH"> Other  </option>

                </select>
         </td>
	 </tr>
         <tr>										
	 <td> Phone Number:</td>
	 <td style= "border:5px solid black;text-align:left; border-radius:5px;  padding:8px">  
		     <input type="text" name="mobile_no" placeholder=" enter your number" /> </td>
         </tr>
        
         <tr>										
	 <td >  file upload:</td>
	 <td style= "border:5px solid black;text-align:left; border-radius:5px;  padding:8px">  <input type="file" name= "filename" /> </td>
         </tr>
	 <tr>
	 <td > Hobbies: </td>
	 <td style= "border:5px solid black;text-align:left; border-radius:5px;  padding:8px"> 
	 	    <input type="checkbox" name="hobby[]" value="reading" id="hobby1"/>reading
                    <input type="checkbox" name="hobby[]" value="watching movies" id="hobby2"/>watching movies
                    <input type="checkbox" name="hobby[]" value="dancing" id="hobby3"/>dancing
	 </td>
	 </tr>	
         <tr>		
	 <td style= "border:5px solid black;text-align:left; border-radius:5px;  padding:8px"  colspan="2">  
		     <input type="submit" name="Register" value="register" /> </td>
         </tr>		




</table>

</body>
</html>
