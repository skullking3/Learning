<!doctype html>
 <html>
   <head>
     <title>
	Registration Page 
     </title>
   </head>
<style>
tbody {background-color: lightgreen;}
thead {background-color: orange;} 
</style>
   
 <body bgcolor ="lightblue">
      <table style= "border:5px solid black;"  >
      <thead>
         <tr>
         <th colspan="2"  style= color:"blue" border:10px black;text-align:center; >Registration</th>
         </tr>
      </thead>
 <tbody>
         <tr>     
	 <td style= "border:5px solid black;text-align:left;">NAME:</td> 
	 <td style= "border:5px solid black;text-align:left;">
		    <input type= "textbox" name="fname" value="" ></td>
         </tr>
         <tr>		        
         <td style= "border:5px solid black;text-align:left;">Email:</td>
	 <td style= "border:5px solid black;text-align:left;">
		    <input type="textbox" name="email"></td>
         <tr>										
	 <td style= "border:5px solid black;text-align:left;">  Password:   	    </td>
	 <td style= "border:5px solid black;text-align:left;">  
		     <input type="password" name="password" placeholder="Please enter password" /> </td>
         </tr>

         </tr>
         <tr>						 
	 <td style= "border:5px solid black;text-align:left;">Gender: </td>
	 <td style= "border:5px solid black;text-align:left;"> 
	            <input type="radio" name="gender" value="male" id="gender1"/>male
                    <input type="radio" name="gender" value="female" id="gender2"/>female
                    <input type="radio" name="gender" value="others" id="gender3"/>others
	 </td>
         </tr>
         <tr>										
	 <td style= "border:5px solid black;text-align:left;">	Date of birth:   	    </td>
	 <td style= "border:5px solid black;text-align:left;">  <input type="date" name="DOB" />     </td>
         </tr>
		
         <tr>	
         <td style= "border:5px solid black;text-align:left;"> Select Country</td>							
	 <td style= "border:5px solid black;text-align:left;"> <select name="country">
                <option value = "DE"> Delhi    </option>
                <option value = "NE"> Nepal    </option>
                <option value = "LU"> Lucknow    </option>
                <option value = "OTH"> Other  </option>

                </select>
         </td>
	 </tr>
         <tr>										
	 <td style= "border:5px solid black;text-align:left;">  Phone Number:   	    </td>
	 <td style= "border:5px solid black;text-align:left;">  
		     <input type="text" name="mobile_no" placeholder="" /> </td>
         </tr>
        
         <tr>										
	 <td style= "border:5px solid black;text-align:left;">  file upload:	    </td>
	 <td style= "border:5px solid black;text-align:left;">  <input type="file" name= "filename" /> </td>
         </tr>
	 <tr>
	 <td style= "border:5px solid black;text-align:left;">   Hobbies 		    </td>
	 <td style= "border:5px solid black;text-align:left;"> 
	 	    <input type="checkbox" name="hobby[]" value="reading" id="hobby1"/>reading
                    <input type="checkbox" name="hobby[]" value="watching movies" id="hobby2"/>watching movies
                    <input type="checkbox" name="hobby[]" value="dancing" id="hobby3"/>dancing
	 </td>
	 </tr>	
         <tr>		
	 <td style= "border:5px solid black;text-align:left;"  colspan="2">  
		     <input type="submit" name="Register" value="register" /> </td>
         </tr>		




</table>

</body>
</html>
