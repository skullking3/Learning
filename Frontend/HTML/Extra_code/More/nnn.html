<html>
<head>
<style>
input{
width:500px;
height:60px;
font-size:30px;
}
</style>
<script>
function live()
{
var x=document.getElementById("input").value;
var y=document.getElementById("result");
y.style.backgroundColor=x;
}
</script>
</head>
<body id="result">
<center>
<h1>Live color Viewer</h1>
<input id="input" oninput="live()">
</center>
</body>
</html>
