<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dropdwon</title>
    <style>
        .dropd{
            background-color: rgb(91, 106, 191);
           
            padding: 10px;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        .dropd{
            position: relative;
            display: inline-block;
        }



        .drop {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
  }

  .dropb a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
  }
    
  
  .dropb a:hover {background-color: #f1f1f1}
  
  .drop:hover .dropdown-content {
    display: block;
  }
  
  .drop:hover .dropbtn {
    background-color: #3e8e41;
  }
    </style>
</head>
<body>
<div class="dropd">
    <button type="button" class="dropb">about us-></button>
    <div class="drop">
    <a href="#home">HOME</a>
    <a href="#home">contact us</a>
    <a href="#home">About us</a>
    <a href="#home">Registration</a>

    </div>


</div>
</body>
</html>
